<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="gesta">
  <title>gesta (small sizes)</title>

  <!--
    The mark at 16-32 px. The details that carry the identity at 128 px - the dotted axis, the
    sparkle, the glass bevel - turn into noise once the letter is 12 pixels tall, and measuring it
    showed the 16 px tile reading as a blob. What is left is the letter, one rim, and the two field
    colours that survive at that size. Fewer things, bigger.
  -->

  <defs>
    <linearGradient id="rimS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.00" stop-color="#6FF7FF"/>
      <stop offset="0.45" stop-color="#4FC3FF"/>
      <stop offset="0.70" stop-color="#8A5CFF"/>
      <stop offset="1.00" stop-color="#FFB45C"/>
    </linearGradient>
    <linearGradient id="baseS" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#101A44"/>
      <stop offset="1" stop-color="#1A0B3E"/>
    </linearGradient>
    <clipPath id="clipS">
      <rect x="62" y="62" width="388" height="388" rx="100" ry="100"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipS)">
    <rect x="62" y="62" width="388" height="388" rx="100" ry="100" fill="url(#baseS)"/>
    <!--
      The letter, scale 1.32 about the centre and stroked 52 instead of 40: below 32 px a 40 unit
      stroke on a 132 unit bowl disappears into the counter, so the glyph has to be heavier than it
      is at full size to keep the same apparent weight.
    -->
    <g transform="translate(256 256) scale(1.3) translate(-236 -256)">
      <circle cx="236" cy="236" r="68" fill="none" stroke="#FFFFFF" stroke-width="52"/>
      <path d="M304 236 V330 A34 34 0 0 1 270 364 H244"
            fill="none" stroke="#FFFFFF" stroke-width="52"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <rect x="62" y="62" width="388" height="388" rx="100" ry="100"
        fill="none" stroke="url(#rimS)" stroke-width="14"/>
</svg>
