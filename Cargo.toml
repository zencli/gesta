[package]
name = "gesta"
version = "0.8.1"
edition = "2021"
description = "Source control for AI agents"
license = "MIT"

[[bin]]
name = "gesta"
path = "src/main.rs"

[dependencies]
# 0.43 pulls libsqlite3-sys 0.40, the first version patched for
# RUSTSEC-2026-0459 (CVE-2026-119375 in the bundled SQLite).
# `backup` gives a consistent snapshot of a live database: `VACUUM INTO` would work too, but the
# backup API takes a connection that is already open and reports progress, so a backup of a large
# store can be interrupted and resumed rather than restarting from zero.
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
# TLS. rustls is pure Rust, so it adds no second C toolchain next to the bundled
# SQLite; the `ring` provider is the one that builds without a nightly compiler.
# TLS is behind a feature: it costs 880 KB of binary and 8 ms of page-in, and
# the commands an agent runs in a loop (status, diff, commit) never touch it.
# Built with --features tls for `serve --tls` and https:// remotes.
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "ring", "tls12", "logging"] }
# Crypto primitives for stored credentials: ChaCha20-Poly1305 to seal a secret,
# HMAC-SHA256 as the key derivation, and the system random source. `ring` is
# already in the tree for TLS and reviewed by people who do this for a living, so
# it is depended on directly instead of hand writing a cipher. Not optional: the
# secret store must work in a build without TLS.
ring = "0.17"
# rustls-pemfile is unmaintained (RUSTSEC-2025-0134). rustls-pki-types parses PEM
# itself now, so the separate crate is gone.
rustls-pki-types = { version = "1", optional = true, features = ["std"] }
# Root certificates for a client that talks to a public host.
webpki-roots = { version = "0.26", optional = true }
# Self-signed certificate generation for `serve --tls self-signed`, so a private
# network can be encrypted without an external CA.
rcgen = { version = "0.13", optional = true }
# Regular expressions for `grep --regex`, behind a feature so a build that only needs literal
# search keeps a smaller binary. The engine is the Rust one, which has no lookaround or
# backreferences: a pattern relying on them is refused rather than silently mismatched.
regex = { version = "1.13", optional = true, default-features = false, features = ["std", "perf", "unicode"] }

# WinFSP is the Windows filesystem driver `gesta mount` uses. It only builds on Windows, and a Linux
# build must not see it: listing it unconditionally makes every non-Windows build fail in a
# dependency that no Linux code path reaches.
[target.'cfg(windows)'.dependencies]
winfsp = "0.13.2"
winfsp-sys = "0.12.1"

[features]
default = ["tls", "regex"]
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots", "dep:rcgen"]
regex = ["dep:regex"]

[profile.release]
opt-level = 3
# Thin LTO instead of fat: the code size win of fat LTO is small here and it is
# what makes the binary slow to page in, which matters more than peak speed for
# a command run thousands of times a day.
lto = "thin"
codegen-units = 4
# Abort instead of unwinding: every panic path in this program ends the process
# anyway, and dropping the unwind tables removes both size and load work.
panic = "abort"
strip = true

[target.'cfg(windows)'.build-dependencies]
winfsp = "0.13.2"
embed-resource = "2"
